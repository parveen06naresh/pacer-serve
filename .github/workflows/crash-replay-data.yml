name: crash-replay data

on:
  push:
    branches: [claude/project-thread-o526s5]
    paths: [crash-replay/scripts/fetch_data.py, .github/workflows/crash-replay-data.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python crash-replay/scripts/fetch_data.py
      - name: Commit data
        run: |
          git config user.name "Parveen Kumar Naresh Kumar"
          git config user.email "220802990+parveen06naresh@users.noreply.github.com"
          git add crash-replay/data/raw
          git commit -m "Crash Replay: refresh market data" || echo "no changes"
          git push
